<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <styles>
        img{
            background-color: mediumorchild;
            height: 100px;
            width: 100px;
            border-radius: 10px;
        }
        div{
            display: flex;
            justify-content: space-around;
        }
    </styles>
</head>
<body>


    <script>
        let apiUrl="https://api.github.com/users";

        let body=document.querySelector("body")
        //login to fetch dumi api data
        fetch(apiUrl).then((res)=>res.json()).then((users)=>{users.forEach((user)=>{
            console.log(user.login,user.id);
            let div = document.createElement("div");
            let image = document.createElement("img");
            let orderList=document.createElement("ol")
            let li1=document.createElement("li")
            let li2=document.createElement("li")
            let li3=document.createElement("li")

            div.appendChild(image)
            div.appendChild(orderList)
            orderList.appendChild(li1);
            orderList.appendChild(li2);
            orderList.appendChild(li3);
            body.appendChild(div);
            image.src=`${user.avatar_url}`
            
            li1.innerHTML=`Username: ${user.login}`
            li2.innerHTML=`ID: ${user.id}`
            li3.innerHTML=`<span>Profile type </span>: ${user.user_view_type}`
        });

        }).catch((err)=>{console.log(err);

        })    
    </script>
</body>
</html>
