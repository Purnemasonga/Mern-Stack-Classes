<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results Table</title>
</head>
<body id="b1">
    <h2>Student Results Table</h2>

    <script>
        // 1. Target the body 
        let b1 = document.getElementById("b1");

        // 2. Data Structure (Array of Objects as shown in image_1f189b.jpg)
        let studentDetails = [
            { name: "Purnema", rollNo: "HU2001", marks: { CNN: 85, CPP: 75, DSA: 90, ADE: 80 } },
            { name: "Sahi", rollNo: "HU2002", marks: { CNN: 70, CPP: 65, DSA: 85, ADE: 75 } },
            { name: "Sadhvi", rollNo: "HU2003", marks: { CNN: 60, CPP: 60, DSA: 60, ADE: 60 } },
            { name: "Ree", rollNo: "HU2004", marks: { CNN: 55, CPP: 58, DSA: 62, ADE: 50 } },
            { name: "Vanellope", rollNo: "HU2005", marks: { CNN: 90, CPP: 88, DSA: 92, ADE: 95 } },
            { name: "Kheer", rollNo: "HU2006", marks: { CNN: 45, CPP: 50, DSA: 48, ADE: 52 } },
            { name: "Srija", rollNo: "HU2007", marks: { CNN: 77, CPP: 72, DSA: 80, ADE: 79 } },
            { name: "Zoya", rollNo: "HU2008", marks: { CNN: 68, CPP: 64, DSA: 70, ADE: 66 } },
            { name: "Alexa", rollNo: "HU2009", marks: { CNN: 82, CPP: 80, DSA: 85, ADE: 88 } },
            { name: "Bixbi", rollNo: "HU2010", marks: { CNN: 50, CPP: 55, DSA: 52, ADE: 58 } },
            { name: "Siri", rollNo: "HU2011", marks: { CNN: 89, CPP: 91, DSA: 87, ADE: 90 } },
            { name: "Rupanzell", rollNo: "HU2012", marks: { CNN: 73, CPP: 75, DSA: 70, ADE: 72 } },
            { name: "Elsa", rollNo: "HU2013", marks: { CNN: 61, CPP: 59, DSA: 65, ADE: 63 } },
            { name: "Anna", rollNo: "HU2014", marks: { CNN: 40, CPP: 45, DSA: 42, ADE: 48 } },
            { name: "Alice", rollNo: "HU2015", marks: { CNN: 95, CPP: 98, DSA: 96, ADE: 94 } },
            { name: "Elios", rollNo: "HU2016", marks: { CNN: 67, CPP: 63, DSA: 69, ADE: 70 } },
            { name: "Sharma", rollNo: "HU2017", marks: { CNN: 54, CPP: 58, DSA: 56, ADE: 52 } },
            { name: "Jane", rollNo: "HU2018", marks: { CNN: 81, CPP: 85, DSA: 80, ADE: 82 } },
            { name: "Simba", rollNo: "HU2019", marks: { CNN: 76, CPP: 70, DSA: 72, ADE: 74 } },
            { name: "Olaf", rollNo: "HU2020", marks: { CNN: 50, CPP: 60, DSA: 90, ADE: 70 } }
        ];

        // 3. Create the Table element.....1
        let t1 = document.createElement("table");
        
        // 4. Create Header Row.....2
        let trH = document.createElement("tr");
        let headers = ["Name", "Roll.no", "CNN", "CPP", "DSA", "ADE", "Total Marks", "Percentage", "Action"];
        
        headers.forEach(hText => {
            let th = document.createElement("th");
            th.innerText = hText;
            trH.appendChild(th);
        });
        t1.appendChild(trH);

        // 5. Generate Data Rows using the Array
        studentDetails.forEach(std => {
            let tr = document.createElement("tr");

            // Calculate values
            let total = std.marks.CNN + std.marks.CPP + std.marks.DSA + std.marks.ADE;
            let percentage = (total / 400) * 100;

            // Map data to cells (matches the order in headers)
            let values = [
                std.name,
                std.rollNo,
                std.marks.CNN,
                std.marks.CPP,
                std.marks.DSA,
                std.marks.ADE,
                total,
                percentage.toFixed(2) + "%", // Rounds to 2 decimal places
                "Action Buttons"
            ];

            values.forEach(val => {
                let td = document.createElement("td"); //Creating columns for the table.....3
                td.innerText = val;
                tr.appendChild(td);
            });

            t1.appendChild(tr);
        });

        // 6. Table Styling (Raw format as requested)
        t1.border = 1;
        t1.cellSpacing = 0;
        t1.cellPadding = 10;
        t1.style.width = "100%";

        // 7. Append Table to Body
        b1.appendChild(t1);

    </script>
</body>
</html>
