    <script>

        let arr=[16,18,21,30,50,35]
        let arr1=['dancing', 32, 'monkey', 54, 'cracked', 'head']
        
        //to store the data in the table format//

        console.table(arr2);
        console.log(arr[6]);

        //inbuillt methods/ inbuilt functions
        let sampleArr=[100,200,300]
        sampleArr.push(400) //can push multiple values but insterted at the end//

        sampleArr.pop() //pop's only 1 element as the end of the array//

        sampleArr.push(250,280,299)
        console.log(sampleArr);
        console.log(sampleArr.splice(1,4)); //spliceit will be selecting the elements and then removes them and then add's new elemnts if required//
